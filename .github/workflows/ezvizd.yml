name: ezvizd

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build le-ezviz-vs
        run: go build -o le-ezviz-vs .
      - name: Build ezvizd
        run: cd web && go build -o ezvizd .
      - name: Test ezvizd
        run: cd web && go test ./...
