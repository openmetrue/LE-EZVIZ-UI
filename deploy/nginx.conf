# Snippet for the TLS vhost that already serves your domain.
# ezvizd listens on 127.0.0.1:8090 and Live is a plain HTTP fMP4 stream, so
# only this reverse-proxy block is needed — no extra inbound ports.
# install.sh writes this to /etc/nginx/snippets/ezvizd.conf and includes it
# in sites-available/default when that file has no /ezviz/ location yet.

location /ezviz/ {
    proxy_pass         http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_buffering    off;
    proxy_read_timeout 3600s;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host $host;
}
